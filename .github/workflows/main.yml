
name: Build Sweety AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q SweetyAI-Mobile-Build.zip -d extracted

      - name: Build APK
        working-directory: extracted/SweetyAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetyAI-APK
          path: extracted/SweetyAI/app/build/outputs/apk/debug/app-debug.apk
